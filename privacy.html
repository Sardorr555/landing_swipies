let currentLang = 'en';

function setLanguage(lang) {
  if (!T[lang]) return;
  currentLang = lang;
  
  // Update buttons
  document.querySelectorAll('#langSwitch button').forEach(btn => {
    if (btn.getAttribute('data-lang') === lang) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });

  // Update DOM translations
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (T[lang][key]) {
      el.innerHTML = T[lang][key];
    }
  });

  // Inject content
  document.getElementById('legalBody').innerHTML = content[lang];

  // Save selection
  localStorage.setItem('swipies_lang', lang);
}

// Language Switch Event Listeners
document.getElementById('langSwitch').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (btn) {
    const lang = btn.getAttribute('data-lang');
    setLanguage(lang);
  }
});

document.addEventListener('DOMContentLoaded', () => {
  const savedLang = localStorage.getItem('swipies_lang') || 'en';
  setLanguage(savedLang);
});
