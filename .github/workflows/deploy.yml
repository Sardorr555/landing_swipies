name: Deploy Swipies Website

on:
  push:
    branches:
      - swipies_25 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server (with git pull)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "=== DEPLOY STARTED ==="

            cd ~/landing_swipies
        
            echo "Pull latest changes from swipies_25"
            git fetch origin
            git checkout swipies_25 || git checkout -b swipies_25 origin/swipies_25
            git reset --hard origin/swipies_25
        
            echo "Copying files to web root /var/www/landing"
            sudo mkdir -p /var/www/landing
            sudo cp -r ~/landing_swipies/. /var/www/landing/
            
            echo "Set permissions on web root"
            sudo chown -R www-data:www-data /var/www/landing
            sudo chmod -R 755 /var/www/landing
        
            echo "Restart Nginx"
            sudo systemctl restart nginx
        
            echo "=== DEPLOY FINISHED ==="