name: Deploy Swipies Website

on:
  push:
    branches:
      - swipies_25 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server (with git pull)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "=== DEPLOY STARTED ==="

            cd ~/landing_swipies
        
            echo "Pull latest changes from swipies_25"
            git fetch origin swipies_25
            git checkout -B swipies_25 FETCH_HEAD
            git reset --hard FETCH_HEAD
        
            echo "Copying files to web root /var/www/html"
            sudo mkdir -p /var/www/html
            sudo cp -r ~/landing_swipies/. /var/www/html/
            
            echo "Set permissions on web root"
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
        
            echo "🔧 Patching Nginx CORS Expose Headers..."
            cat << 'EOF' > /tmp/patch_nginx.py
import os
import re

for f_name in os.listdir('/etc/nginx/sites-enabled'):
    p = os.path.join('/etc/nginx/sites-enabled', f_name)
    if os.path.isfile(p):
        try:
            with open(p, 'r') as f:
                content = f.read()
            
            pattern = r"(add_header\s+['\"]Access-Control-Expose-Headers['\"]\s+['\"])([^'\"]+)(['\"]\s+always;)"
            
            def repl(m):
                prefix = m.group(1)
                values = m.group(2)
                suffix = m.group(3)
                if 'Authorization' not in values:
                    values = values + ',Authorization'
                return prefix + values + suffix
                
            new_content = re.sub(pattern, repl, content)
            if new_content != content:
                with open(p, 'w') as f:
                    f.write(new_content)
                print(f"Updated Nginx config: {p}")
            else:
                print(f"Nginx config {p} is already up to date.")
        except Exception as e:
            print(f"Error patching {p}: {e}")
EOF
            sudo python3 /tmp/patch_nginx.py
            rm -f /tmp/patch_nginx.py
            
            echo "Restart Nginx"
            sudo nginx -t
            sudo systemctl restart nginx
        
            echo "=== DEPLOY FINISHED ==="