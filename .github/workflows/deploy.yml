name: Deploy Swipies Website

on:
  push:
    branches:
      - swipies_25

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "=== DEPLOY STARTED ==="

            # ── 1. Pull latest code ──────────────────────────────────────────
            cd ~/landing_swipies
            git fetch origin swipies_25
            git checkout -B swipies_25 FETCH_HEAD
            git reset --hard FETCH_HEAD

            # ── 2. Install Flask ─────────────────────────────────────────────
            sudo apt-get install -y python3-flask python3-pip 2>/dev/null || true
            sudo pip3 install flask --break-system-packages --quiet 2>/dev/null || true

            # ── 3. Copy ALL files to web root ────────────────────────────────
            sudo mkdir -p /var/www/html
            sudo cp -r ~/landing_swipies/. /var/www/html/
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
            sudo chmod 666 /var/www/html/database.sqlite 2>/dev/null || true

            # ── 4. Install Flask API as a systemd service ────────────────────
            sudo cp /var/www/html/swipies-api.service /etc/systemd/system/swipies-api.service
            sudo sed -i "s/User=ubuntu/User=$USER/g" /etc/systemd/system/swipies-api.service
            sudo systemctl daemon-reload
            sudo systemctl enable swipies-api
            sudo systemctl restart swipies-api
            sleep 2
            echo "Flask API status:"
            sudo systemctl status swipies-api --no-pager || true

            # ── 5. Write Nginx config (proxy + /admin redirect) ──────────────
            sudo python3 /var/www/html/setup_nginx.py

            # ── 6. Test & reload Nginx ────────────────────────────────────────
            sudo nginx -t && sudo systemctl reload nginx

            echo "=== DEPLOY FINISHED ==="